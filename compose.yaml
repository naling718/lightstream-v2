services:
  redis:
    image: redis:7
    container_name: lightstream-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  storage:
    image: rustfs/rustfs:1.0.4
    container_name: lightstream-storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=lightstream
      - RUSTFS_SECRET_KEY=lightstream-secret
      - RUSTFS_CONSOLE_ENABLE=true
    volumes:
      - storage-data:/data

  postgres:
    image: postgres:17
    container_name: lightstream-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=lightstream
      - POSTGRES_USER=lightstream
      - POSTGRES_PASSWORD=lightstream-secret
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "lightstream", "-d", "lightstream" ]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  redis-data:
  storage-data:
  postgres-data:
